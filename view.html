<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="my.css">
    <title>친구 상세 정보</title>
</head>
<body>
    <nav class="navbar navbar-dark custom-navbar shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">👥 내 친구 관리</a>
            <a href="index.html" class="btn btn-outline-light btn-sm">목록으로</a>
        </div>
    </nav>

    <main class="container mt-5" style="min-height: 70vh;">
        <div class="card custom-card mx-auto" style="max-width: 600px;">
            <div class="card-header bg-white pt-4 pb-0 border-0 text-center">
                <h3 class="fw-bold">임기현</h3>
                <span class="badge bg-success mb-3">학교 친구</span>
            </div>
            <div class="card-body px-4">
                <ul class="list-group list-group-flush mb-4">
                    <li class="list-group-item d-flex justify-content-between">
                        <span class="text-muted">전화번호</span> <strong>010-1234-5678</strong>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <span class="text-muted">이메일</span> <strong>123@email.com</strong>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <span class="text-muted">생일</span> <strong>2004-01-28</strong>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <span class="text-muted">주소</span> <strong>부산광역시 기장군 정관읍</strong>
                    </li>
                </ul>
                <div class="d-flex justify-content-between">
                    <button type="button" class="btn btn-danger btn-mobile-full" onclick="deleteData()">Delete (삭제)</button>
                    <a href="edit.html" class="btn btn-primary btn-mobile-full ms-2">Edit (수정)</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="custom-footer text-center text-muted">
        <div class="container"><small>&copy; 2026 Friend Manager.</small></div>
    </footer>

    <script>
        function deleteData() {
            if(confirm("정말 이 친구를 삭제하시겠습니까?")) {
                alert("삭제되었습니다.");
                window.location.href = "index.html";
            }
        }
    </script>
</body>
</html>
